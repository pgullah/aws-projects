apiversion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: MyEKScluster
  region: eu-west-2
  version: 1.31
vpc:
  subnets:
    private:
      eu-west-2a: { id: subnet-0e653ed7eba7d5f9c }
      eu-west-2b: { id: subnet-0e51bbb9a3dc190bb }
      eu-west-2c: { id: subnet-0f51702e935a9219d }
nodeGroups:
  - name: ClusterTwoNodes
    instanceType: t2.micro
    desiredCapacity: 3
    privateNetworking: true